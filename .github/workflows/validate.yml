name: Validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      MONITORCENTER_HARDWARE_TESTS: ''
      MONITORCENTER_HARDWARE_WRITE_TESTS: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build without warnings
        run: dotnet build MonitorCenter.sln -c Release -warnaserror
      - name: Test without hardware access
        run: dotnet test MonitorCenter.sln -c Release --no-build
